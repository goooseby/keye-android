name: Build signed release draft

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in the app
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keye-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore private signing key
        env:
          KEYE_KEYSTORE_BASE64: ${{ secrets.KEYE_KEYSTORE_BASE64 }}
          KEYE_KEYSTORE_PASSWORD: ${{ secrets.KEYE_KEYSTORE_PASSWORD }}
          KEYE_KEY_ALIAS: ${{ secrets.KEYE_KEY_ALIAS }}
          KEYE_KEY_PASSWORD: ${{ secrets.KEYE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('KEYE_KEYSTORE_BASE64', 'KEYE_KEYSTORE_PASSWORD', 'KEYE_KEY_ALIAS', 'KEYE_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing repository secret: {name}')
          path = Path(os.environ['RUNNER_TEMP']) / 'keye-signing.p12'
          path.write_bytes(base64.b64decode(''.join(os.environ['KEYE_KEYSTORE_BASE64'].split()), validate=True))
          path.chmod(0o600)
          PY
      - name: Set up Android command-line tools
        run: |
          python3 - <<'PY'
          import hashlib, os, shutil, urllib.request, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'android-sdk'
          archive = Path(os.environ['RUNNER_TEMP']) / 'android-tools.zip'
          urllib.request.urlretrieve('https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip', archive)
          expected = '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Android command-line tools checksum mismatch')
          unpack = Path(os.environ['RUNNER_TEMP']) / 'android-tools-unpack'
          with zipfile.ZipFile(archive) as tools:
              tools.extractall(unpack)
          (root / 'cmdline-tools').mkdir(parents=True, exist_ok=True)
          shutil.move(str(unpack / 'cmdline-tools'), str(root / 'cmdline-tools' / 'latest'))
          for tool in (root / 'cmdline-tools' / 'latest' / 'bin').iterdir():
              tool.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_HOME={root}\nANDROID_SDK_ROOT={root}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(f'{root}/cmdline-tools/latest/bin\n{root}/platform-tools\n')
          PY
      - name: Install Android build tools
        run: |
          python3 - <<'PY'
          import os, subprocess
          sdkmanager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools', 'latest', 'bin', 'sdkmanager')
          subprocess.run([sdkmanager, '--licenses'], input='y\n' * 100, text=True, stdout=subprocess.DEVNULL, check=True)
          subprocess.run([sdkmanager, 'platform-tools', 'platforms;android-36', 'build-tools;36.0.0'], check=True)
          PY
      - name: Check and build signed APK
        env:
          KEYE_KEYSTORE_PATH: ${{ runner.temp }}/keye-signing.p12
          KEYE_KEYSTORE_PASSWORD: ${{ secrets.KEYE_KEYSTORE_PASSWORD }}
          KEYE_KEY_ALIAS: ${{ secrets.KEYE_KEY_ALIAS }}
          KEYE_KEY_PASSWORD: ${{ secrets.KEYE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Archive R8 mapping and diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-release-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90
      - name: Verify release package
        id: package
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/keye-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/keye-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/keye-android.apk > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'apk-badging.txt').read_text()
          match = re.search(r"package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'", text)
          if not match or match[1] != 'io.github.goooseby.keye':
              raise SystemExit('Unexpected APK package')
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', match[3]):
              raise SystemExit('Release version must use major.minor.patch')
          if 'application-debuggable' in text:
              raise SystemExit('Debuggable packages must not be published')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{match[3]}\n')
          Path('dist/release-notes.md').write_text(os.environ['RELEASE_NOTES'], encoding='utf-8')
          PY
          (cd dist && sha256sum keye-android.apk > SHA256SUMS)
      - name: Create reviewable GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$TAG" dist/keye-android.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Keye $TAG" --notes-file dist/release-notes.md --draft
