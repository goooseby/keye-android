server {
    listen 80;
    server_name keye.kovra.top;
    return 301 https://keye.kovra.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name keye.kovra.top;

    ssl_certificate /etc/nginx/ssl/keye.kovra.top.pem;
    ssl_certificate_key /etc/nginx/ssl/keye.kovra.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KEYE:1m;
    ssl_session_timeout 1d;
    server_tokens off;

    root /var/www/keye/current;
    index index.html;
    autoindex off;
    charset utf-8;
    access_log /var/log/nginx/keye.access.log;
    error_log /var/log/nginx/keye.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    include /etc/nginx/keye-downloads.conf;

    location = /desktop/announcements.json {
        alias /var/www/keye/desktop/announcements.json;
        default_type application/json;
        expires 1m;
    }

    location = /announcements.json {
        default_type application/json;
        expires 1m;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }

    location ~* \.(css|js|png)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
