# Included inside the existing keye.kovra.top HTTPS server.
# Kept outside the website release symlink, so page deployments retain installers.
location ^~ /downloads/ {
    alias /var/www/keye/downloads/;
    autoindex off;
    default_type application/octet-stream;
    types {
        application/json json;
        text/plain txt;
        application/vnd.android.package-archive apk;
        application/octet-stream exe;
    }
    expires 5m;
    location ~ /\. { deny all; }
}
